#####################################################################################################################################################################################################
# Project:       Juniper
# Sub-Project:   JuniperData
# File Name:     notify-consumers.yml
# Author:        Paul Calnon
# License:       MIT License
# Copyright:     Copyright (c) 2024-2026 Paul Calnon
#
# Description:   Tell the repos that install the juniper-data PACKAGE from PyPI that a release has
#                landed, so their CI runs against it (juniper-recurrence#178, owner ruling: option 3).
#
#    Why: a consumer lane that is path-scoped to its own directory cannot see a break that arrives
#    through a dependency. Decision 11 (#369) broke all seven juniper-recurrence bench datasets and
#    that lane reported success for 15 days, because the change that broke it touched no path it
#    watches. This fires a `repository_dispatch` of type `juniper-data-published` into each consumer
#    with client_payload {source, version, sha}; the receiver waits until the version is
#    installable and tests exactly that version.
#
#    Two entry points, one implementation:
#      * workflow_call -- from publish.yml, AFTER the PyPI job succeeds (a dispatch before PyPI
#        serves the version would test the previous release).
#      * workflow_dispatch -- re-send for a version ALREADY on PyPI: to prove the path end to end
#        without cutting a release, or to re-run a consumer check that was lost.
#
#    The dispatch FAILS LOUDLY (`curl --fail-with-body`). A bare `curl -X POST`, which is what
#    juniper-data-client#211 found in that repo's senders, reports a 403/404 from an under-scoped
#    token as success -- the same silence #178 is about. CROSS_REPO_DISPATCH_TOKEN is
#    a PAT; GITHUB_TOKEN cannot dispatch into another repository. Payload values reach the shell
#    only through `env:`.
#
#    A 204 is not the finish line. GitHub returns it whether or not any workflow in the target
#    listens for the event type, so the job then waits about two minutes for the consumer to start
#    a `juniper-data-published` run, and fails if none appears (the second residual gap on #178).
#    It fails with a different error if the consumer's runs could not be listed at all, because
#    then nothing is known about whether a run started.
#
#    To add a consumer: append its repo to the matrix, and give its workflow a
#    `repository_dispatch: types: [juniper-data-published]` trigger that tests the payload version,
#    and NO `run-name:` -- the confirmation step matches the run by its default title, which for a
#    dispatch run is the event type. The token needs Contents: Read and write on the consumer to
#    dispatch. Listing a PUBLIC consumer's runs needs no permission, but grant Actions: Read too,
#    so the confirmation does not rest on that.
#
#####################################################################################################################################################################################################

name: Notify consumers of a release

on:
  workflow_call:
    inputs:
      version:
        description: "The juniper-data version just published to PyPI (a leading 'v' is stripped)"
        required: true
        type: string
    secrets:
      CROSS_REPO_DISPATCH_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "A juniper-data version ALREADY on PyPI, e.g. 0.15.0 -- re-sends its dispatch"
        required: true
        type: string

permissions: {}

jobs:
  dispatch:
    name: Dispatch juniper-data-published (${{ matrix.repo }})
    runs-on: ubuntu-latest
    # The confirmation window is about two minutes when requests return promptly. Each request
    # has its own --max-time; this bounds the job if anything else hangs.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Repos whose CI installs the juniper-data package from PyPI and must hear about a release.
        repo: [juniper-recurrence]
    steps:
      - name: Dispatch
        id: dispatch
        env:
          TOKEN: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN }}
          RAW_VERSION: ${{ inputs.version }}
          REPO: ${{ matrix.repo }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="${RAW_VERSION#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be X.Y.Z (optionally v-prefixed), got '${RAW_VERSION}'"
            exit 1
          fi
          if [[ -z "${TOKEN}" ]]; then
            echo "::error::CROSS_REPO_DISPATCH_TOKEN is not available to this run"
            exit 1
          fi
          payload="$(jq -nc --arg v "${version}" --arg s "${SOURCE_SHA}" \
            '{event_type: "juniper-data-published", client_payload: {source: "juniper-data", version: $v, sha: $s}}')"
          # Taken BEFORE the POST, and 30 s early to absorb clock skew between this runner and
          # GitHub. The next step looks for a consumer run created at or after it.
          since="$(date -u -d '30 seconds ago' +%Y-%m-%dT%H:%M:%SZ)"
          echo "since=${since}" >> "${GITHUB_OUTPUT}"
          curl --fail-with-body --silent --show-error --max-time 30 -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/pcalnon/${REPO}/dispatches" \
            -d "${payload}"
          echo "dispatched juniper-data-published ${version} to pcalnon/${REPO}"
          echo "- dispatched \`juniper-data-published\` **${version}** to \`pcalnon/${REPO}\`" >> "${GITHUB_STEP_SUMMARY}"

      # A 204 from /dispatches proves only that GitHub ACCEPTED the event. GitHub returns 204
      # whether or not any workflow in the target listens for that event type, so a renamed or
      # missing listener passes the step above and the consumer never runs. That is the second
      # residual gap recorded on juniper-recurrence#178. So wait for a run to appear.
      #
      # The match is by event, creation time and TITLE, not by payload: the runs API does not
      # expose client_payload. A dispatch run's default title is its event type, so only a
      # juniper-data-published run counts; this holds while the consumer's workflow sets no
      # `run-name:`. A second juniper-data-published dispatch within the window would satisfy the
      # check too; juniper-data is the only sender into juniper-recurrence today. A failed GET, or
      # a body that is not a run listing (not JSON, empty, or no `workflow_runs`), is retried
      # rather than ending the step, because a transient error here would turn a delivered release
      # red. If NO listing succeeds in the window, the step says so with its own error and the last
      # response, rather than blaming the consumer's workflow, about which nothing was learned; if
      # SOME failed, the "no run" error says how many and quotes the last. Listing runs of a PUBLIC
      # repo needs no token permission; a private consumer would need Actions: Read on this token.
      - name: Confirm the consumer started a run
        env:
          TOKEN: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN }}
          REPO: ${{ matrix.repo }}
          SINCE: ${{ steps.dispatch.outputs.since }}
          EVENT_TYPE: juniper-data-published
        run: |
          set -euo pipefail
          attempts=12
          listed=0
          failed=0
          detail=""
          for attempt in $(seq 1 "${attempts}"); do
            if runs="$(curl --fail-with-body --silent --show-error --max-time 20 --get \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer ${TOKEN}" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  --data-urlencode "event=repository_dispatch" \
                  --data-urlencode "created=>=${SINCE}" \
                  --data-urlencode "per_page=20" \
                  "https://api.github.com/repos/pcalnon/${REPO}/actions/runs")"; then
              # A listing counts only if it is a JSON object with a `workflow_runs` key. An empty
              # body, `{}` or an error object is a FAILED listing, like a non-2xx response: jq -e
              # exits 4 on empty input, and error() exits 5.
              if url="$(jq -er --arg title "${EVENT_TYPE}" 'if type == "object" and has("workflow_runs") then ([.workflow_runs[]? | select(.display_title == $title)][0].html_url // "") else error("no workflow_runs key") end' <<<"${runs}")"; then
                listed=1
                if [[ -n "${url}" ]]; then
                  echo "pcalnon/${REPO} started a ${EVENT_TYPE} run (attempt ${attempt}): ${url}"
                  echo "- \`pcalnon/${REPO}\` started ${url}" >> "${GITHUB_STEP_SUMMARY}"
                  exit 0
                fi
              else
                failed=$((failed + 1))
                body_text="${runs//[$'\r\n']/ }"
                detail="a body that is not a run listing: ${body_text:-(empty)}"
                detail="${detail:0:300}"
                echo "::warning::listing pcalnon/${REPO}'s runs returned ${detail} (attempt ${attempt} of ${attempts})"
              fi
            else
              rc=$?
              failed=$((failed + 1))
              body_text="${runs//[$'\r\n']/ }"
              detail="curl exit ${rc}: ${body_text:-(no body)}"
              detail="${detail:0:300}"
              echo "::warning::listing pcalnon/${REPO}'s runs failed on attempt ${attempt} of ${attempts}: ${detail}"
            fi
            if (( attempt < attempts )); then
              sleep 10
            fi
          done
          if (( listed == 0 )); then
            echo "::error::GitHub accepted the dispatch, but pcalnon/${REPO}'s runs could not be listed in any of ${attempts} attempts, so whether it started a ${EVENT_TYPE} run is unknown. Last response: ${detail:-none}. Check the repo name, and that CROSS_REPO_DISPATCH_TOKEN has Actions: Read on it if it is private."
            exit 1
          fi
          # Some listing succeeded, so "no run appeared" is evidence about the consumer -- but only as
          # good as the listings after it. Say how many failed, so an outage that began after the
          # first listing is not read as a missing listener.
          partial=""
          if (( failed > 0 )); then
            partial=" ${failed} of ${attempts} listings failed, so the window was only partly observed; the last failure: ${detail}."
          fi
          echo "::error::GitHub accepted the dispatch, but pcalnon/${REPO} started no ${EVENT_TYPE} run in about two minutes (runs created at or after ${SINCE}, 30 s before the dispatch).${partial} Check that one of its workflows declares 'repository_dispatch: types: [${EVENT_TYPE}]', sets no run-name, and is enabled."
          exit 1
