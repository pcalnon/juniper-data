---
#####################################################################################################################################################################################################
# Project:       Juniper
# Sub-Project:   JuniperData
# Application:   juniper_data
# File Name:     ci.yml
# Author:        Paul Calnon
# Version:       0.4.0
#
# Date Created:  2026-01-30
# Last Modified: 2026-02-06
#
# License:       MIT License
# Copyright:     Copyright (c) 2024-2026 Paul Calnon
#
# Description:
#    GitHub Actions CI/CD Pipeline for JuniperData Dataset Generation Service
#    - Pre-commit hooks for code quality (black, isort, flake8, mypy, bandit)
#    - Unit tests with coverage enforcement
#    - Integration tests
#    - Security scanning (Gitleaks, Bandit SARIF, pip-audit)
#    - Proper failure handling (no continue-on-error for critical steps)
#    - Dependency caching for performance
#
# References:
#    - JUNIPER-DATA-001: CI/CD Pipeline Setup
#    - Best practices: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions
#####################################################################################################################################################################################################

name: CI/CD Pipeline
on:
  push:
    # Topic-branch globs (feature/**, fix/**) removed 2026-08-13: once a PR is open,
    # `push` and `pull_request` BOTH fire for the same commit, so every job ran twice.
    # The concurrency group is keyed on github.ref, which differs between a branch push
    # (refs/heads/...) and a PR (refs/pull/N/merge), so cancel-in-progress never collapsed
    # the pair. Same fix as juniper-recurrence#108 / juniper-ml#1076 / juniper-canopy#488.
    # `pull_request` covers every commit once a PR exists; workflow_dispatch remains for a
    # branch with no PR open.
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  repository_dispatch:
    types: [data-client-updated]
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC (slow tests)
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SERVICE_NAME: JuniperData
  PYTHON_TEST_VERSION: "3.14"
  COVERAGE_FAIL_UNDER: "80"

jobs:
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Pre-commit: Code Quality Checks (runs across multiple Python versions)
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  pre-commit:
    name: Pre-commit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install pre-commit

      - name: Cache pre-commit hooks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Run pre-commit hooks
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       JuniperData - Pre-commit Checks                      ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          pre-commit run --all-files --show-diff-on-failure

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Docs: Validate documentation link integrity
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  docs:
    name: Documentation Links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # Wave 2 of the doc-link migration plan
      # (juniper-ml notes/JUNIPER_DOC_TOOLS_PYPI_MIGRATION_PLAN_2026-05-18.md):
      # the validator is installed from PyPI instead of run from an
      # inline copy in scripts/. That copy has since been removed, so
      # this step is no longer a one-line revert.
      - name: Install juniper-doc-tools
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install "juniper-doc-tools>=0.1.0,<0.2.0" "pyyaml>=6.0"

      - name: Validate Documentation Links
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       JuniperData - Documentation Link Validation          ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          juniper-check-doc-links \
            --exclude templates \
            --exclude history \
            --exclude legacy \
            --exclude pull_requests \
            --exclude releases \
            --exclude analysis \
            --exclude fixes \
            --exclude development \
            --exclude CHANGELOG.md \
            --exclude tmp \
            --cross-repo skip

      # Catches the failure class that broke 3 juniper-X CIs on
      # 2026-05-18: a workflow that invokes ``python|bash <path>`` after
      # the path was renamed or moved. Wave 4 of the dep-docs PyPI
      # migration (juniper-ml notes/JUNIPER_CI_TOOLS_PYPI_MIGRATION_PLAN_2026-05-20.md)
      # ships this lint as the ``juniper-lint-workflow-paths`` console
      # script in ``juniper-ci-tools>=0.2.0``; the inline byte-identical
      # copy at ``util/test_workflow_script_paths.py`` was deleted in
      # this PR. The shared tool discovers the repo root via a
      # ``.github/workflows/`` walk-up so it works out-of-the-box.
      - name: Install juniper-ci-tools (workflow-path + agents-md lints)
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install "juniper-ci-tools>=0.9.0,<0.10.0"

      - name: Lint .github/workflows/ script paths
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Workflow script-path lint                            ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          juniper-lint-workflow-paths

      # Pins AGENTS.md's `**Version**:` header to pyproject.toml's
      # [project].version so version bumps stay in sync with the
      # agent-facing contract. Shipped as the
      # ``juniper-lint-agents-md-version`` console script in
      # ``juniper-ci-tools>=0.3.0`` (juniper-ml#310); the inline
      # byte-identical copy at ``util/test_agents_md_version_drift.py``
      # was deleted in this PR.
      - name: Lint AGENTS.md version vs pyproject.toml
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       AGENTS.md version-drift lint                         ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          juniper-lint-agents-md-version

      # Pins AGENTS.md's header bullet block to the canonical six-field
      # schema (Project / Repository / Author / License / Version /
      # Last Updated, in that relative order). Currency of the
      # `**Last Updated**` field is maintained by the
      # `.github/workflows/agents-md-touch-up.yml` workflow (auto-bumps
      # on every PR push). Shipped as the
      # ``juniper-lint-agents-md-header`` console script in
      # ``juniper-ci-tools>=0.4.0`` (juniper-ml#319).
      - name: Lint AGENTS.md header schema
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       AGENTS.md header-schema lint                         ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          juniper-lint-agents-md-header

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Async-route audit (Phase 4 — enforced).
  # Catches the BUG-JD-10 bug class (sync-blocking calls inside async def
  # route handlers). Hard-fails on any new violation; this repo reached
  # zero violations at end of Phase 3 (PR #96).
  # See juniper-ml notes/ASYNC_ROUTE_AUDIT_HOOK_MIGRATION_PLAN.md §4.
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  async-route-audit:
    name: Async-route audit (BUG-JD-10 class)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff==0.15.6"

      - name: Run async-route audit
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       JuniperData - Async-route audit (BUG-JD-10)          ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          ruff check --select ASYNC --output-format=github juniper_data/

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Unit Tests: Run unit tests with coverage enforcement
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  unit-tests:
    name: Unit Tests + Coverage (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The macOS leg is REQUIRED, like the three Linux legs. METRICS-MON R3.7 / seed-(R1.3 design)
    # added it as a continue-on-error soak (juniper-data#61), and juniper-data#63 ended the soak on
    # 2026-05-01 by setting the include block's ``experimental`` flag to false, so this expression
    # is false on every leg and a failing macOS leg fails the job. Ruleset 14748749 requires
    # "Unit Tests + Coverage (Python 3.12 on macos-latest)" with the three Linux contexts (read
    # 2026-10-29). The leg catches platform divergence: cross-platform rss_mb sampling, POSIX-only
    # assumptions, and BSD tools (macOS `base64` has no `-w0`; juniper-data#467 and #498 both met it).
    continue-on-error: ${{ matrix.experimental == true }}
    needs: [pre-commit]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.12"
            experimental: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       JuniperData - Install Dependencies                   ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          python -m pip install --upgrade "pip>=26.1.1"
          pip install "juniper-data-client @ git+https://github.com/pcalnon/juniper-data-client.git@main"
          pip install ".[all]"

      - name: Create required directories
        run: |
          mkdir -p reports/junit reports/htmlcov

      - name: Run Unit Tests
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       JuniperData - Unit Tests (Fast Only)                 ║"
          echo "╚════════════════════════════════════════════════════════════╝"

          python -m pytest \
            -m "unit and not slow" \
            juniper_data/tests/unit \
            --verbose \
            --timeout=60 \
            --maxfail=5 \
            --junitxml=reports/junit-unit.xml \
            --cov=juniper_data \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/htmlcov \
            --cov-report=json:reports/coverage.json

      - name: Enforce Aggregate Coverage Gate (${{ env.COVERAGE_FAIL_UNDER }}%)
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║   JuniperData - Aggregate Coverage Gate (${{ env.COVERAGE_FAIL_UNDER }}%)              ║"
          echo "╚════════════════════════════════════════════════════════════╝"

          python -m coverage report --fail-under=${{ env.COVERAGE_FAIL_UNDER }}

      - name: Enforce per-file coverage gate (blocking)
        # Per-file coverage rollout C-5 (juniper-ml
        # notes/JUNIPER_ECOSYSTEM_PER_FILE_COVERAGE_ROLLOUT_SCOPING_2026-06-30.md):
        # exit 1 if any source file's statement coverage < 90 OR a sub-module's
        # pooled (statement-weighted) coverage < 95. This replaces the advisory
        # scripts/check_module_coverage.py per-module step, which only *warned*
        # on below-threshold modules. The shared juniper-ci-tools gate computes
        # statement % itself from coverage.json, so the branch=true coverage
        # config does not change the gate basis.
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║   JuniperData - Per-File Coverage Gate (>=90 file / >=95)   ║"
          echo "╚════════════════════════════════════════════════════════════╝"

          pip install "juniper-ci-tools>=0.9.0,<0.10.0"
          juniper-coverage-gap-map --coverage-json reports/coverage.json --enforce

      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: |
            reports/coverage.xml
            reports/htmlcov/
          retention-days: 30

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        if: matrix.python-version == '3.14'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: reports/coverage.xml
          flags: unittests
          name: juniper-data-coverage
          fail_ci_if_error: false

      - name: Upload Test Results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: unit-test-results-py${{ matrix.python-version }}
          path: reports/junit-unit.xml
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Build: Build sdist and wheel artifacts
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [unit-tests]

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install build
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install build

      - name: Build sdist and wheel
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       JuniperData - Build Package                          ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          python -m build --sdist --wheel

      - name: Verify build artifacts
        run: |
          ls -la dist/
          test -f dist/*.tar.gz
          test -f dist/*.whl
          # Regression guard (0.7.1): the equities generators load sp500_constituents.csv via a
          # filesystem path, so it MUST ship inside the wheel (see [tool.setuptools.package-data]).
          # 0.7.0 omitted it and the equities/equities_seq extras were non-functional from pip.
          python -c "import glob, zipfile; whl = glob.glob('dist/*.whl')[0]; names = zipfile.ZipFile(whl).namelist(); assert any(n.endswith('juniper_data/generators/equities/sp500_constituents.csv') for n in names), 'sp500_constituents.csv missing from the wheel - check [tool.setuptools.package-data]'; print('OK: sp500_constituents.csv present in', whl)"
          # Regression guard (after 0.15.0): the suite is a subpackage, so `include = ["juniper_data*"]`
          # matched it and every wheel through 0.15.0 shipped it (97 of 0.15.0's 201 members).
          # Asserted on the built WHEEL, not on pyproject.toml: the config proves nothing until
          # the artifact omits the members. Matched on a path COMPONENT, so a tests/ package
          # anywhere in the tree fails it, not only juniper_data/tests/. The CSV guard above is
          # what keeps this from passing on an empty wheel.
          python -c "import glob, zipfile; whl = glob.glob('dist/*.whl')[0]; bad = [n for n in zipfile.ZipFile(whl).namelist() if 'tests' in n.split('/')[:-1]]; assert not bad, f'{len(bad)} test-suite members in the wheel, e.g. {bad[:3]} - check the exclude in [tool.setuptools.packages.find]'; print('OK: no tests/ member in', whl)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: build-artifacts
          path: dist/
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Dependency Docs: Generate dependency documentation artifacts
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  dependency-docs:
    name: Dependency Documentation
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ env.PYTHON_TEST_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_TEST_VERSION }}

      - name: Set up Conda (Miniforge)
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb  # v4.1.0
        with:
          miniforge-version: latest
          auto-activate-base: true
          python-version: ${{ env.PYTHON_TEST_VERSION }}

      - name: Install project dependencies
        shell: bash -l {0}
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install "juniper-data-client @ git+https://github.com/pcalnon/juniper-data-client.git@main"
          pip install ".[all]"

      # Wave 2 of the dep-docs PyPI migration -- replaces the inline
      # bash scripts/generate_dep_docs.sh with the juniper-ci-tools
      # console script from PyPI. See juniper-ml plan
      # notes/JUNIPER_CI_TOOLS_PYPI_MIGRATION_PLAN_2026-05-20.md.
      # The inline script will be removed in Wave 4.
      - name: Install juniper-ci-tools
        shell: bash -l {0}
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install "juniper-ci-tools>=0.9.0,<0.10.0"

      - name: Generate Dependency Documentation
        shell: bash -l {0}
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       JuniperData - Dependency Documentation               ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          juniper-generate-dep-docs

      - name: Upload Dependency Documentation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dependency-docs
          path: |
            conf/requirements_ci.txt
            conf/requirements_ci_*.txt
            conf/conda_environment_ci.yaml
            conf/conda_environment_ci_*.yaml
          retention-days: 90

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Integration Tests: Run integration tests (PRs and main/develop pushes)
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: github.event_name == 'pull_request' || github.ref_name == 'main' || github.ref_name == 'develop'

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python ${{ env.PYTHON_TEST_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_TEST_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       JuniperData - Install Dependencies                   ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          python -m pip install --upgrade "pip>=26.1.1"
          pip install "juniper-data-client @ git+https://github.com/pcalnon/juniper-data-client.git@main"
          pip install ".[all]"

      - name: Create required directories
        run: |
          mkdir -p reports/junit

      - name: Run Integration Tests (Fast Only)
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       JuniperData - Integration Tests (Fast Only)          ║"
          echo "╚════════════════════════════════════════════════════════════╝"

          python -m pytest \
            -m "integration and not slow" \
            juniper_data/tests/integration \
            --verbose \
            --timeout=120 \
            --maxfail=3 \
            --junitxml=reports/junit-integration.xml

      - name: Upload Integration Test Results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: integration-test-results
          path: reports/junit-integration.xml
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Security: Run security scans (Gitleaks, Bandit, pip-audit)
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  security:
    name: Security Scans
    runs-on: ubuntu-latest
    needs: [pre-commit]

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install security tools
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install "bandit[sarif]" pip-audit

      - name: Create reports directory
        run: mkdir -p reports/security

      - name: Run Gitleaks (Secrets Detection)
        # gitleaks-action v2.3.9 explicitly rejects ``repository_dispatch``
        # ("ERROR: The [repository_dispatch] event is not yet supported"),
        # which kills the entire Security Scans job whenever the workflow
        # is triggered by an upstream-published-event from juniper-ml.
        # The push/PR triggers cover the human-driven entry points that
        # actually need secret scanning; the dispatch trigger is for
        # ecosystem-fanout test runs and doesn't introduce new commits to
        # scan.
        if: github.event_name != 'repository_dispatch'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action v2.3.9 ships as a Node.js 20 action.
          # GitHub forces Node 24 on 2026-06-02; opt in now to eliminate
          # the deprecation warning and ensure continued operation past
          # the cutover. Drop this once gitleaks-action publishes a
          # release pinned to node24 (upstream PR #215).
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
          # The engine version, stated rather than inherited: gitleaks-action
          # v3.0.0 defaults to this same 8.24.3 (src/index.js at the pinned
          # SHA), but a bump of the action SHA would change it silently.
          # juniper_data/tests/unit/test_gitleaks_config.py pins it.
          GITLEAKS_VERSION: "8.24.3"
        # What it scans (src/index.js / src/gitleaks.js at the pinned SHA):
        # `push` and `pull_request` scan the event's own commits; `schedule`
        # and `workflow_dispatch` pass no --log-opts, so they scan EVERY commit
        # reachable from every branch and tag of this fetch-depth-0 checkout.
        # .gitleaks.toml and .gitleaksignore are auto-discovered at the repo
        # root. Until 2026-10-25 .gitleaks.toml had no `[extend]` table, so
        # this step ran with ZERO rules and could not fail.

      - name: Run Bandit (SAST)
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       JuniperData - Bandit Security Scan                   ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          # Generate SARIF report (always succeeds for upload)
          bandit -r juniper_data -x juniper_data/tests -f sarif -o reports/security/bandit.sarif --exit-zero
          # Blocking check - fail on medium or higher severity
          bandit -r juniper_data -x juniper_data/tests --confidence-level medium --severity-level medium

      - name: Upload Bandit SARIF to GitHub Security
        # The required `Bandit` check run is created by code scanning from
        # this upload. On a PR the upload always runs, and a failure turns
        # Security Scans red with the cause in this step's log, instead of
        # leaving the PR waiting forever for a `Bandit` context that never
        # posts. A missing SARIF counts as a failure there: it is how
        # juniper-canopy#780's bandit, which wrote no file, went unnoticed.
        # Every other event keeps the old tolerance: ``hashFiles`` skips the
        # step when the file is absent, and a failed upload leaves the job
        # green.
        if: always() && (github.event_name == 'pull_request' || hashFiles('reports/security/bandit.sarif') != '')
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          sarif_file: reports/security/bandit.sarif
        continue-on-error: ${{ github.event_name != 'pull_request' }}

      - name: Run pip-audit (Dependency Vulnerabilities)
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       JuniperData - pip-audit Dependency Scan              ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          pip install "juniper-data-client @ git+https://github.com/pcalnon/juniper-data-client.git@main"
          pip install ".[all]"
          pip freeze | grep -ivE "^juniper[-_]data" > reports/security/requirements.txt
          pip-audit -r reports/security/requirements.txt --strict

      - name: Gitleaks config self-test (real engine)
        # The unit-test job runs this file too, but with no gitleaks binary its
        # real-engine cases skip. Here the binary the Gitleaks step put on PATH
        # is present, and GITLEAKS_PARITY_REQUIRED turns a missing binary into
        # a failure instead of a skip, because a check that could not run is
        # not a pass: the built-in ruleset must fire on a fabricated token
        # through the auto-discovered .gitleaks.toml (the config is not
        # vacuous). After pip-audit, whose `.[all]` install brings pytest and
        # the dependencies the test conftest imports.
        if: github.event_name != 'repository_dispatch'
        env:
          GITLEAKS_PARITY_REQUIRED: "1"
        run: python -m pytest juniper_data/tests/unit/test_gitleaks_config.py -v

      - name: Upload Security Reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: security-reports
          path: reports/security/
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Lockfile Check: Verify requirements.lock matches pyproject.toml
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  lockfile-check:
    name: Lockfile Freshness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install uv==0.11.8

      - name: Check lockfile freshness
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       JuniperData - Lockfile Freshness Check               ║"
          echo "╚════════════════════════════════════════════════════════════╝"

          # Resolve pyproject.toml using the committed lockfile as constraints.
          # The check passes when the pinned versions still satisfy
          # pyproject.toml. It does NOT fail just because newer versions are
          # available on PyPI — that's the whole point of pinning. The check
          # fails only when pyproject.toml has drifted from what the lockfile
          # can support: a new dep was added, a min-version was bumped past a
          # pin, or an entry was removed. Refresh by running:
          #   uv pip compile pyproject.toml \
          #     --extra api --extra observability --extra mnist --extra equities \
          #     --upgrade -o requirements.lock
          uv pip compile pyproject.toml \
            --extra api \
            --extra observability \
            --extra mnist \
            --extra equities \
            --constraint requirements.lock \
            -o /tmp/requirements.lock.check

          # Compare only the resolved pin lines (pkg==version), ignoring all
          # comments. uv's --constraint mode adds "# -c requirements.lock"
          # annotations and the autogenerated header embeds the -o path, both
          # of which would otherwise create false-positive diffs.
          grep '^[^[:space:]#]' requirements.lock | sort > /tmp/lock_pins
          grep '^[^[:space:]#]' /tmp/requirements.lock.check | sort > /tmp/check_pins

          if ! diff -u /tmp/lock_pins /tmp/check_pins; then
            echo ""
            echo "::error::requirements.lock no longer satisfies pyproject.toml — refresh with: uv pip compile pyproject.toml --extra api --extra observability --extra mnist --extra equities --upgrade -o requirements.lock"
            exit 1
          fi

          echo "::notice::requirements.lock satisfies pyproject.toml ✓"

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Docker Build & Smoke Test: Verify Dockerfile builds and container starts
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  docker-build:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request' || github.ref_name == 'main' || github.ref_name == 'develop'

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build Docker Image
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       JuniperData - Docker Build                           ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          docker build -t juniper-data:ci-${{ github.sha }} .

      - name: Verify Container Starts
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       JuniperData - Docker Smoke Test                      ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          docker run -d --name juniper-data-test \
            -p 8100:8100 \
            juniper-data:ci-${{ github.sha }}

          echo "Waiting for service to become healthy..."
          for i in $(seq 1 30); do
            if docker inspect --format='{{.State.Health.Status}}' juniper-data-test 2>/dev/null | grep -q healthy; then
              echo "Service is healthy!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "::error::Service did not become healthy within 30 attempts"
              docker logs juniper-data-test
              exit 1
            fi
            sleep 2
          done

      - name: Verify Package Import
        run: |
          docker exec juniper-data-test python -c "import juniper_data; print(juniper_data.__version__)"

      - name: Verify Health Endpoint
        run: |
          curl -sf http://localhost:8100/v1/health | python3 -m json.tool

      - name: Cleanup
        if: always()
        run: |
          docker stop juniper-data-test 2>/dev/null || true
          docker rm juniper-data-test 2>/dev/null || true

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Memory Budget (BLOCKING, standalone): P5 port of juniper-ml's size ratchet.
  # Plan: juniper-ml notes/JUNIPER_2026-08-18_JUNIPER-ML_SHARED-SESSION-MEMORY-PLAN.md (§P5);
  # tracking issue juniper-ml#1326. Rendered by juniper-ml's
  # util/ad-hoc/2026-08-25_p5_port_memory_budget.py from figures measured IN THIS REPO on
  # 2026-08-25 -- re-measure, never transcribe.
  #
  # WHY THE RATE AXIS SHIPS FIRST, AND ALONE. juniper-ml's AGENTS.md grew ~20x in six months
  # WHILE UNDER FOUR ACTIVE CI GATES -- every one of them enforced structure or currency and
  # none enforced SIZE; 172 of 200 main-line merges grew it against 14 that shrank it, by 2,628
  # bytes between them. A cut without a ceiling is undone in ~44 days, and a ceiling set AFTER a
  # cut locks in the inflated level. So the ceiling lands first and the cut comes later; this job
  # carries no relocation check yet, because juniper-data has not cut anything to check.
  #
  # STANDALONE, and deliberately ABSENT from any Quality Gate `needs:` (plan correction C9). A
  # `needs:` entry is the wrong promotion mechanism: it makes a skip on a non-PR event fail the
  # gate. Promotion happens in the branch RULESET, the same way Sequence Safety was promoted --
  # and only after the soak below -- which ended 2026-08-26: `--advisory` is gone and the three
  # negative controls were re-run against the non-advisory job (plan §P5 step d).
  #
  # BLOCKING as of 2026-08-26 (plan §P5 step d). The job soaked with `--advisory` from the port's merge,
  # and the flag was removed only after three negative controls passed IN THIS REPO against the
  # non-advisory invocation -- clean tree exits 0, growth past the ceiling exits 1, and a waiver
  # trailer exits 0 -- because a blocking gate that cannot fail is worse than none. Whether this
  # context is REQUIRED is decided in the branch ruleset, never here.
  #
  # SLACK, MEASURED HERE. The ceiling was seeded at the exact size on the day the port landed
  # (43,493 chars, zero slack) and raised 2026-08-26 to 45,493 (+2,000) under an Allow-Ceiling-
  # Raise: AGENTS.md trailer. The slack is the largest single AGENTS.md-growing commit re-measured
  # over the 30 days to 2026-08-26 (1,982; median 827, 4 grew / 0 shrank, ~109 chars/day), floored
  # at 2,000 because one fleet-wide docs fan-out (2026-08-21) added 1,982 chars to six repos'
  # AGENTS.md at once -- the shape a zero-slack ceiling cannot absorb. Growth past the ceiling now
  # FAILS this check; Allow-Budget-Overrun: AGENTS.md is the loan for a warranted overrun, and a
  # cut is what brings the ceiling back down (hand-edit with slack, never bare --ratchet).
  memory-budget:
    name: Memory Budget
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      contents: read
    steps:
      - name: Checkout Code (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0 # need the base tip to apply the no-worsening rule

      - name: Set up Python ${{ env.PYTHON_TEST_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_TEST_VERSION }}

      - name: Check memory-file size budget
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║  juniper-data - Memory File Size Budget (BLOCKING)         ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          # The base is read from the event rather than hardcoded; merge_group has no
          # github.base_ref, hence the fallback.
          BASE_REF="${{ github.base_ref || 'main' }}"
          git fetch --no-tags origin "$BASE_REF"
          # Allow-Budget-Overrun is a LOAN, not a pass: it suppresses the failure without moving
          # the ceiling, so the debt still blocks the next author. Trailers are injected from an
          # explicit file (the checker never shells out for them) so the classifier stays pure.
          # Two-dot FETCH_HEAD..HEAD = exactly the commits this PR adds on top of base.
          git log --format=%B FETCH_HEAD..HEAD > memory-budget-trailers.txt
          # BLOCKING as of 2026-08-26: `--advisory` (the soak setting) is gone, so a violation exits 1 and
          # fails this check. Escape hatch, when the growth is genuinely warranted: add the commit trailer
          #   Allow-Budget-Overrun: AGENTS.md
          # and carry it into the SQUASH message -- squash composes from the commit messages, so
          # a trailer left only in the PR body is silently discarded.
          python3 util/memory_budget_check.py \
            --base-ref FETCH_HEAD \
            --trailers-file memory-budget-trailers.txt

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Required Checks Aggregator: Final quality gate
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  required-checks:
    name: Quality Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [pre-commit, unit-tests, build, dependency-docs, integration-tests, security, docs, lockfile-check, docker-build]

    steps:
      - name: Check Quality Gate Status
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       JuniperData - Quality Gate Status                    ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          echo ""
          echo "Pre-commit:        ${{ needs.pre-commit.result }}"
          echo "Unit Tests:        ${{ needs.unit-tests.result }}"
          echo "Build:             ${{ needs.build.result }}"
          echo "Dependency Docs:   ${{ needs.dependency-docs.result }}"
          echo "Integration Tests: ${{ needs.integration-tests.result }}"
          echo "Security:          ${{ needs.security.result }}"
          echo "Documentation:     ${{ needs.docs.result }}"
          echo "Lockfile Check:    ${{ needs.lockfile-check.result }}"
          echo "Docker Build:      ${{ needs.docker-build.result }}"
          echo ""

          # Pre-commit and unit-tests MUST pass
          if [[ "${{ needs.pre-commit.result }}" != "success" ]]; then
            echo "::error::Pre-commit checks failed"
            exit 1
          fi

          if [[ "${{ needs.unit-tests.result }}" != "success" ]]; then
            echo "::error::Unit tests failed"
            exit 1
          fi

          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "::error::Build failed"
            exit 1
          fi

          # The four conditional lanes (dependency docs, security, integration tests, Docker
          # build) pass on `success` or `skipped` and fail on anything else. `skipped` is the
          # designed pass for a lane that does not run on every event. `cancelled` is not a
          # pass: a lane cut short by a newer push or a manual cancel never finished. These
          # tests used to be `== "failure"`, which let a cancelled lane read as PASSED
          # (flood-3 §4). Each lane is also its own required context.

          # Dependency docs: skipped = OK, failure or cancelled = error
          if [[ "${{ needs.dependency-docs.result }}" != "success" && "${{ needs.dependency-docs.result }}" != "skipped" ]]; then
            echo "::error::Dependency documentation generation failed"
            exit 1
          fi

          # Security should pass (but SARIF upload failures are allowed); skipped = OK, cancelled = error
          if [[ "${{ needs.security.result }}" != "success" && "${{ needs.security.result }}" != "skipped" ]]; then
            echo "::error::Security scans failed"
            exit 1
          fi

          # Integration tests: skipped = OK (for feature branches), failure or cancelled = error
          if [[ "${{ needs.integration-tests.result }}" != "success" && "${{ needs.integration-tests.result }}" != "skipped" ]]; then
            echo "::error::Integration tests failed"
            exit 1
          fi

          # Documentation link validation must pass
          if [[ "${{ needs.docs.result }}" != "success" ]]; then
            echo "::error::Documentation link validation failed"
            exit 1
          fi

          # Lockfile must be fresh (stale lockfile = Docker builds don't match CI)
          if [[ "${{ needs.lockfile-check.result }}" != "success" ]]; then
            echo "::error::Lockfile freshness check failed — requirements.lock is stale"
            exit 1
          fi

          # Docker build: skipped = OK (only runs on PRs and main/develop), failure or cancelled = error
          if [[ "${{ needs.docker-build.result }}" != "success" && "${{ needs.docker-build.result }}" != "skipped" ]]; then
            echo "::error::Docker build and smoke test failed"
            exit 1
          fi

          echo "::notice::Quality Gate PASSED ✓"

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Slow Tests: Run tests marked as slow (daily schedule or manual dispatch)
  # A required context of ruleset 14748749; a pull request reports it skipped, which counts as passing.
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  slow-tests:
    name: Slow Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install "juniper-data-client @ git+https://github.com/pcalnon/juniper-data-client.git@main"
          pip install ".[all]"

      - name: Run Slow Tests
        # pytest's exit status is the step's. This call used to end `|| echo "No slow tests found"`,
        # so a failing slow test, a collection error and a run that selected no test all reported
        # success on a required context (juniper-ml
        # notes/JUNIPER_2026-10-08_JUNIPER-ECOSYSTEM_CURSOR-FLOOD-3-DISPOSITION.md §4). Exit 5 (no
        # test selected) fails too, with an annotation naming it: a lane that runs nothing must not
        # pass. The 2026-10-29 scheduled run selected 15 of 2,511 (`15 passed, 2496 deselected`), so
        # the schedule stays green. juniper_data/tests/unit/test_slow_tests_step.py rehearses this shell.
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       JuniperData - Slow Tests                             ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          rc=0
          python -m pytest -m "slow" --verbose --timeout=600 || rc=$?
          if [ "${rc}" -eq 5 ]; then
            echo "::error title=Slow Tests::pytest selected no test marked slow (exit 5). A lane that runs nothing must not pass."
          fi
          exit "${rc}"

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Notify: Build status notification
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  notify:
    name: Build Notification
    runs-on: ubuntu-latest
    needs: [required-checks]
    if: always()

    steps:
      - name: Build Status Summary
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       JuniperData - Build Complete                         ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          echo ""
          echo "========== CI/CD Pipeline Summary =============================="
          echo "Status:   ${{ needs.required-checks.result }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Branch:   ${{ github.ref_name }}"
          echo "Commit:   ${{ github.sha }}"
          echo "Actor:    ${{ github.actor }}"
          echo "Event:    ${{ github.event_name }}"
          echo "================================================================"
