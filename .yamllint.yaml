---
extends: default

rules:
  line-length:
    max: 120
    level: warning
  document-start: disable
  comments-indentation: disable
  truthy:
    allowed-values: ['true', 'false', 'yes', 'no', 'on', 'off']
    check-keys: false

# conf/conda_environment_ci.yaml is generated by scripts/generate_dep_docs.sh
# and uses conda's @EXPLICIT format (YAML preamble + bare-URL package list),
# which is not valid YAML past the @EXPLICIT directive. The timestamped
# variants (conf/conda_environment_ci_*.yaml) inherit the same issue.
ignore: |
  .venv/
  venv/
  __pycache__/
  .pytest_cache/
  .mypy_cache/
  data/
  logs/
  reports/
  conf/conda_environment_ci.yaml
  conf/conda_environment_ci_*.yaml
