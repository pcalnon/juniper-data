# Gitleaks configuration for JuniperData
# See: https://github.com/gitleaks/gitleaks#configuration
#
# 2026-10-25: until this date the file had no `[extend]` table, and a gitleaks v8
# config without one loads ONLY its own `[[rules]]` -- of which it has none. CI's
# Gitleaks step (ci.yml, Security Scans job) therefore ran with ZERO rules and
# passed vacuously on every push, pull request, scheduled and dispatched run: a
# fabricated GitHub token went through it while gitleaks' built-in config flags
# the same token. juniper-ml#2203 found and fixed the same defect there.
# `[extend] useDefault = true` below loads gitleaks' built-in ruleset; the
# allowlist EXTENDS it. juniper_data/tests/unit/test_gitleaks_config.py pins
# that the table is present and that the real engine fires.
#
# The built-in ruleset reports historical false positives. Those are in
# .gitleaksignore, each COMMIT-scoped and under a comment naming its class.
#
# Usage (CI and a local run both auto-discover this file and .gitleaksignore):
#   gitleaks git --redact          # committed history
#   gitleaks dir --redact .        # the working tree, INCLUDING gitignored files

# Load gitleaks' built-in rules; the allowlist below EXTENDS them.
# Removing this table silently empties the ruleset again (see the header).
[extend]
useDefault = true

[allowlist]
  description = "Allowlist for known historical false positives"

  # Historical ARC-AGI public API identifier (not a secret) removed in later commits.
  # Commit 4bd37a6c hardcoded this value before it was moved to environment variables.
  commits = [
    "4bd37a6c7057e7380cd4470fcc717a76289fa193",
  ]
