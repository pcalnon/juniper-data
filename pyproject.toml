# File Name:     pyproject.toml
# Author:        Paul Calnon
# Version:       0.6.0
#
# Date Created:  2026-01-29
# Last Modified: 2026-02-06
#
# License:       MIT License
# Copyright:     Copyright (c) 2024,2025,2026 Paul Calnon
#
# Description:
#    Python project configuration for Juniper Data
#    Dataset generation and management service for the Juniper ecosystem
#
# References:
#    - juniper-cascor project patterns
#    - JUNIPER-DATA-001: CI/CD Pipeline Setup
#####################################################################################################################################################################################################

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "juniper-data"
version = "0.11.0"
description = "Dataset generation and management service for the Juniper ecosystem"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Paul Calnon" }]
requires-python = ">=3.12"

dependencies = [
    "cachetools>=5.3.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
arc-agi = [
    "arc-agi>=0.9.0",
]
equities = [
    # Equities generator: daily OHLCV via Yahoo Finance + pandas conditioning.
    # SEC EDGAR shares / market-cap is fetched via stdlib urllib (no extra dep).
    "yfinance>=0.2.40",
    "pandas>=2.0.0",
]
mnist = [
    # MNIST / Fashion-MNIST generator (generators/mnist/): loads the canonical
    # Hub-hosted parquet datasets (ylecun/mnist, zalando-datasets/fashion_mnist)
    # via Hugging Face `datasets`. The [vision] extra pulls Pillow, which the
    # Image feature requires to decode the 28x28 PNGs under .with_format("numpy")
    # (verified empirically: bare `datasets` raises "To support decoding images,
    # please install 'Pillow'" at generation time). Floor at the 4.x line:
    # datasets 4.0 removed dataset-script execution entirely (Hub parquet
    # loading only — no remote-code path), and the generator's API surface
    # (load_dataset(repo_id, split=...), .shuffle(seed=...), .select(range),
    # .with_format("numpy") bulk column access) is stable from 4.x through the
    # currently-pinned 5.x. The 4.x line is also the first contemporary with
    # this service's Python 3.14 runtime (older 2.x/3.x chains predate cp314
    # wheels for pyarrow et al.).
    # Heavy dependency chain (pyarrow, pandas, huggingface-hub, fsspec) —
    # deliberately extra-gated, never part of the base install. First call
    # downloads from the Hugging Face Hub into the HF cache (HF_HOME); offline
    # deployments need a seeded cache (see README "MNIST / Fashion-MNIST").
    "datasets[vision]>=4.0.0",
]
api = [
    "fastapi>=0.100.0",
    # CVE-2026-48710 (GHSA-86qp-5c8j-p5mr): Host-header poisoning of
    # request.url.path bypasses path-based security checks in starlette
    # <=1.0.0. Floor at 1.0.1 (the patched version) so transitive
    # resolution can never select a vulnerable starlette via fastapi.
    "starlette>=1.0.1",
    "uvicorn[standard]>=0.23.0",
    "pydantic-settings>=2.0.0",
    # METRICS-MON R2.1.2 / seed-06: shared observability primitives
    # (DependencyStatus, ReadinessResponse, JuniperJsonFormatter,
    # RequestIdMiddleware, PrometheusMiddleware, configure_sentry,
    # configure_logging, get_prometheus_app, set_build_info, and the
    # R1.1/R1.2/R1.3 contract constants). 0.3.0 added
    # ``MetricsAuthMiddleware`` + ``parse_trusted_networks`` +
    # ``normalize_client_ip`` + ``METRICS_DEFAULT_TRUSTED_IPS`` +
    # ``TrustedNetwork`` so this package can drop its inline copy
    # (the original source of the promotion via PR #157). 0.3.1
    # added a ``logging.warning`` when ``scope["client"][0]`` is
    # unparseable — juniper-data's inline copy was silent on that
    # path, so this is a behaviour change: operators now see a log
    # entry for misconfigured scrapers in addition to the 403. 0.4.0
    # added optional ``git_sha`` / ``build_date`` passthrough on
    # ``set_build_info`` + the shared ``ReadinessResponse`` model for
    # build provenance (juniper-ml
    # notes/BUILD_PROVENANCE_DESIGN_2026-06-14.md).
    "juniper-observability>=0.4.0",
    # SEC-F01 / HO-2 (per-service adoption wave): boot-time auth-posture
    # self-check. The API lifespan calls enforce_auth_posture with the
    # resolved api_keys beside the startup banner, so an empty/blank
    # JUNIPER_DATA_API_KEYS secret (which silently disables APIKeyAuth and
    # serves the API open — docs exposed, protected routes unauthenticated —
    # behind a healthy health check) is loud at boot. Stdlib-only import
    # surface; 0.5.0 is the release that ships the check. Capped <0.6.0 to
    # match the fleet's service-core pin practice (a deliberate deviation
    # from this file's floor-only style — pre-1.0 minors may break).
    "juniper-service-core>=0.5.0,<0.6.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.2.0",
    "pytest-asyncio>=0.21.0",
    "pytest-benchmark>=4.0.0",
    # Property-based testing for the sequence-windowing leakage invariants
    # (tests/unit/test_sequence_windowing_leakage.py; WS-1 / juniper-data#168).
    "hypothesis>=6.0.0",
    "httpx>=0.24.0",
    "coverage[toml]>=7.0.0",
    "juniper-data-client>=0.3.0",
    # PyYAML is required by juniper-generate-dep-docs (juniper-ci-tools) to parse
    # `conda env export --no-builds` output and validate the resulting
    # conf/conda_environment_ci.yaml. The CI workflow installs it
    # explicitly in the dep-docs job as well; this declaration keeps
    # local `pip install -e .[test]` runs of the script working too.
    # See juniper-cascor-worker PR #74 for the diagnostic detour that
    # motivated declaring this in both places.
    "PyYAML>=6.0",
]
observability = [
    "prometheus-client>=0.20.0",
    "sentry-sdk[fastapi]>=2.0.0",
]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.0.0",
    "bandit[sarif]>=1.9.4",
    "pip-audit>=2.7.0",
    "pre-commit>=3.0.0",
]
all = [
    "juniper-data[api,arc-agi,equities,mnist,observability,dev,test]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["juniper_data*"]

[tool.setuptools.package-data]
# Ship generator data files (the equities S&P 500 constituents list) inside the wheel. Without
# this, setuptools packages only *.py, so the equities / equities_seq generators raise
# FileNotFoundError on sp500_constituents.csv from a pip install (the 0.7.0 packaging defect).
"juniper_data.generators.equities" = ["*.csv"]

[tool.ruff]
# Ecosystem convention is 512, but ruff >=0.15 caps line-length at 320.
# E501 is already ignored so the linter does not enforce line length;
# this value only governs the formatter wrapping threshold.
line-length = 320
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "B",      # flake8-bugbear (includes B9xx opinionated)
    "C4",     # flake8-comprehensions
    "I",      # isort (replaces standalone isort)
    "UP",     # pyupgrade (replaces standalone pyupgrade)
    "SIM",    # flake8-simplify
    "T20",    # flake8-print
]
ignore = [
    "E203",   # whitespace before ':' (formatter conflict)
    "E265",   # block comment should start with '# '
    "E266",   # too many leading '#' for block comment
    "E501",   # line too long (formatter handles this)
    "E402",   # module level import not at top of file
    "E226",   # missing whitespace around arithmetic operator
    "C409",   # unnecessary-literal-within-tuple-call (style preference)
    "SIM102", # collapsible-if (style preference)
    "SIM105", # use-contextlib-suppress (style preference)
    "SIM117", # multiple-with-statements (style preference, keeps code clearer)
    "B904",   # raise-without-from-inside-except
    "B905",   # zip-without-explicit-strict
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"juniper_data/__main__.py" = ["T201"]
"juniper_data/api/routes/*.py" = ["B008"]
"juniper_data/tests/**/*.py" = ["F841", "C901"]
"juniper_data/tests/fixtures/*.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["juniper_data"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.bandit]
exclude_dirs = ["tests", "reports", "logs", "htmlcov", "data"]
skips = ["B101", "B311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
minversion = "6.0"
testpaths = ["juniper_data/tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--benchmark-disable",
]
# Filter expected deprecation warnings from dependencies
filterwarnings = [
    "ignore::DeprecationWarning:uvicorn.*",
    "ignore::DeprecationWarning:httpx.*",
    "ignore::PendingDeprecationWarning:pydantic.*",
]
markers = [
    "unit: Unit tests for individual components",
    "integration: Integration tests for full workflows",
    "performance: Performance and benchmarking tests",
    "slow: Tests that take a long time to run",
    "spiral: Tests specifically for spiral dataset generation",
    "api: Tests for API endpoints",
    "generators: Tests for data generators",
    "storage: Tests for storage operations",
]
timeout = 60
timeout_method = "signal"

[tool.coverage.run]
source_pkgs = ["juniper_data"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/data/*",
    "*/logs/*",
    # "*/__main__.py",
    # "*/api/*",
]
branch = true

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "^\\s*pass\\s*$",
]
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.mypy]
python_version = "3.14"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "^data/",
    "^logs/",
    "^reports/",
    "^htmlcov/",
]

[[tool.mypy.overrides]]
module = [
    "numpy.*",
    "pydantic.*",
    "fastapi.*",
    "uvicorn.*",
]
ignore_missing_imports = true

# Relaxed type checking for test code
[[tool.mypy.overrides]]
module = [
    "juniper_data.tests.*",
]
# allow_untyped_defs = true
disallow_untyped_defs = false
