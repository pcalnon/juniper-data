---
# markdownlint configuration for juniper-data
# Mirrors the shared juniper-ml config (line-length 512, lenient
# ordered-list and emphasis rules). Aligned with the rest of the
# Juniper ecosystem per
# juniper-ml/notes/CI_PIPELINE_ALIGNMENT_PLAN_2026-04-29.md.
# Rule reference: https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md

# MD029/ol-prefix: Allow any ordered list prefix style
ol-prefix: false

# MD013/line-length: Match Juniper ecosystem 512-char line length
line-length:
  line_length: 512

# MD046/code-block-style: Allow consistent code block style
code-block-style: consistent

# MD036/emphasis-style: Disable emphasis-as-heading check
emphasis-style: false

# MD024/no-duplicate-heading: Allow duplicate headings under different parents
no-duplicate-heading:
  siblings_only: true

# MD040/fenced-code-language: Disabled — pre-existing markdown across the
# repo uses bare ``` fences in places where the content is ambiguous
# (mixed examples). Re-enable in a follow-up fix-up PR once those
# fences have been audited.
fenced-code-language: false
